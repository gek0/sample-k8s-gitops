server:
  affinity: ""
  ha:
    enabled: true
    raft:
      enabled: true
  dataStorage:
    storageClass: local-path
    size: 1Gi
  service:
    enabled: true
    type: ClusterIP
    standby:
      enabled: false
  extraServices:
    - name: vault-active
      type: LoadBalancer
      annotations:
        metallb.universe.tf/address-pool: "192.168.104.53"
      ports:
        - name: http
          port: 8200
          targetPort: 8200
