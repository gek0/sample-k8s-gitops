apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crossplane-creds-devops-aws
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  namespace: github-personal-crossplane-devops-aws
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cluster-store
    kind: ClusterSecretStore
  target:
    name: crossplane-creds-devops-aws
    creationPolicy: Owner
  data:
    - secretKey: credentials
      remoteRef:
        key: secret/crossplane/devops-aws
        property: credentials
