grafana:
  enabled: true

  service:
    type: LoadBalancer

  envFromSecret: grafana-keycloak-secret

  grafana.ini:
    server:
      root_url: "http://grafana.local.io"
    auth:
      disable_login_form: false # keep login form as admin fallback
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grafana
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: openid email profile roles
      auth_url: http://keycloak.local.io/realms/master/protocol/openid-connect/auth
      token_url: http://keycloak.keycloak.svc.cluster.local/realms/master/protocol/openid-connect/token
      api_url: http://keycloak.keycloak.svc.cluster.local/realms/master/protocol/openid-connect/userinfo
      role_attribute_path: "contains(roles[*], 'Admin') && 'Admin' || 'Viewer'"

  defaultDashboardsEnabled: true

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          isDefault: true
        - name: Loki
          type: loki
          access: proxy
          url: http://loki-single-binary.monitoring.svc.cluster.local:3100
          isDefault: false
          jsonData:
            healthCheckEnabled: false

  persistence:
    enabled: true
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 2Gi

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
    datasources:
      enabled: false

alertmanager:
  service:
    type: LoadBalancer

prometheus:
  service:
    type: LoadBalancer
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
