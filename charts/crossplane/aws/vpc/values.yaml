# -- Deploy this chart. Set to false to skip all resources without removing the ArgoCD Application.
enabled: true

# -- Environment name (dev, prod). Used in resource names and tags.
env: ""
# -- AWS region where the VPC is created.
region: ""
# -- AWS account ID. Used in tags.
accountId: ""
# -- VPC name prefix. Combined with env: `{env}-{vpcPrefix}`.
vpcPrefix: ""
# -- VPC CIDR block.
cidrBlock: ""
# -- Name of the Crossplane ProviderConfig to use for AWS authentication.
providerConfig: devops-aws

# -- AWS resource tags applied to the VPC and all subnets.
tags:
  Team: devops
  ManagedBy: crossplane

# -- Public subnets. Each gets mapPublicIpOnLaunch=true and SubnetType=public tag.
# @default -- `[]`
publicSubnets: []
# - name: public-a
#   cidrBlock: "10.0.1.0/24"
#   availabilityZone: "us-east-1a"

# -- Private subnets. Each gets mapPublicIpOnLaunch=false and SubnetType=private tag.
# @default -- `[]`
privateSubnets: []
# - name: private-a
#   cidrBlock: "10.0.10.0/24"
#   availabilityZone: "us-east-1a"
