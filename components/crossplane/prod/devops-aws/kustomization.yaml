apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: prod-

resources:
  - ../../base/devops-aws

patches:
  - target:
      kind: Bucket
    patch: |-
      - op: add
        path: /spec/forProvider/region
        value: us-east-2
      - op: add
        path: /spec/forProvider/tags
        value:
          Environment: prod
          Team: devops
          ManagedBy: crossplane
  - target:
      kind: Bucket
    path: account-patch.yaml
