apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: prod-

resources:
  - ../../base/devops-aws

patches:
  - target:
      group: s3.aws.upbound.io
    patch: |-
      - op: add
        path: /spec/forProvider/region
        value: us-east-2
  - target:
      kind: Bucket
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          crossplane.io/external-name: prod-devops-aws-us-east-2-173381260310
      - op: add
        path: /spec/forProvider/tags
        value:
          Environment: prod
          Team: devops
          ManagedBy: crossplane
          AccountId: "173381260310"
