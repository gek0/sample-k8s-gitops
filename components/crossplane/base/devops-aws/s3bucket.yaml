apiVersion: s3.aws.upbound.io/v1beta1
kind: Bucket
metadata:
  name: devops-aws
spec:
  forProvider: {}
  providerConfigRef:
    name: devops-aws
---
apiVersion: s3.aws.upbound.io/v1beta1
kind: BucketVersioning
metadata:
  name: devops-aws
spec:
  forProvider:
    bucketRef:
      name: devops-aws
    versioningConfiguration:
      - status: Enabled
  providerConfigRef:
    name: devops-aws
---
apiVersion: s3.aws.upbound.io/v1beta1
kind: BucketOwnershipControls
metadata:
  name: devops-aws
spec:
  forProvider:
    bucketRef:
      name: devops-aws
    rule:
      - objectOwnership: BucketOwnerEnforced
  providerConfigRef:
    name: devops-aws
---
apiVersion: s3.aws.upbound.io/v1beta1
kind: BucketPublicAccessBlock
metadata:
  name: devops-aws
spec:
  forProvider:
    bucketRef:
      name: devops-aws
    blockPublicAcls: true
    blockPublicPolicy: true
    ignorePublicAcls: true
    restrictPublicBuckets: true
  providerConfigRef:
    name: devops-aws
---
apiVersion: s3.aws.upbound.io/v1beta1
kind: BucketServerSideEncryptionConfiguration
metadata:
  name: devops-aws
spec:
  forProvider:
    bucketRef:
      name: devops-aws
    rule:
      - applyServerSideEncryptionByDefault:
          - sseAlgorithm: aws:kms
        bucketKeyEnabled: true
  providerConfigRef:
    name: devops-aws
---
apiVersion: s3.aws.upbound.io/v1beta1
kind: BucketPolicy
metadata:
  name: devops-aws
spec:
  forProvider:
    bucketRef:
      name: devops-aws
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "DenyNonTLS",
            "Effect": "Deny",
            "Principal": "*",
            "Action": "s3:*",
            "Resource": "*",
            "Condition": {
              "Bool": { "aws:SecureTransport": "false" }
            }
          },
          {
            "Sid": "DenyOldTLS",
            "Effect": "Deny",
            "Principal": "*",
            "Action": "s3:*",
            "Resource": "*",
            "Condition": {
              "NumericLessThan": { "s3:TlsVersion": "1.3" }
            }
          },
          {
            "Sid": "DenyNonKMSUploads",
            "Effect": "Deny",
            "Principal": "*",
            "Action": "s3:PutObject",
            "Resource": "*",
            "Condition": {
              "StringNotEquals": { "s3:x-amz-server-side-encryption": "aws:kms" }
            }
          }
        ]
      }
  providerConfigRef:
    name: devops-aws
