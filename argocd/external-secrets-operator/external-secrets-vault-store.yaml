apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-vault-store
  namespace: argocd
  labels:
    tier: infra
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: cluster-ops
  source:
    repoURL: 'https://github.com/gek0/sample-k8s-gitops.git'
    targetRevision: HEAD
    path: services/external-secrets-operator/vault-store
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
