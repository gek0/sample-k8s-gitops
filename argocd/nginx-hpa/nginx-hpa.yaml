apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-hpa
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: github-personal
  source:
    repoURL: 'https://github.com/gek0/sample-k8s-app.git'
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: github-personal-nginx-hpa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
