apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-infra
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: cluster-ops
  source:
    repoURL: 'https://github.com/gek0/sample-k8s-gitops.git'
    targetRevision: HEAD
    path: services/vault/base
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
