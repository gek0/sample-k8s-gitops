apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-webapp
  namespace: argocd
  labels:
    tier: app
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: github-personal
  source:
    repoURL: 'https://github.com/gek0/sample-k8s-gitops.git'
    targetRevision: HEAD
    path: services/vault/webapp
  destination:
    server: https://kubernetes.default.svc
    namespace: github-personal-vault-webapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
