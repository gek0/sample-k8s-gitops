apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  labels:
    tier: infra
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: cluster-ops
  sources:
    - repoURL: 'https://charts.bitnami.com/bitnami'
      chart: keycloak
      targetRevision: '25.3.2' # check https://github.com/bitnami/charts/tree/main/bitnami/keycloak
      helm:
        valueFiles:
          - $values/services/keycloak/values.yaml
    - repoURL: 'https://github.com/gek0/sample-k8s-gitops.git'
      targetRevision: HEAD
      ref: values
    - repoURL: 'https://github.com/gek0/sample-k8s-gitops.git'
      targetRevision: HEAD
      path: services/keycloak/base
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
