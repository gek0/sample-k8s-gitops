apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  labels:
    tier: infra
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: cluster-ops
  sources:
    - repoURL: 'https://prometheus-community.github.io/helm-charts'
      chart: kube-prometheus-stack
      targetRevision: '65.1.1' # pin to a specific version; check https://github.com/prometheus-community/helm-charts/releases
      helm:
        valueFiles:
          - $values/services/monitoring/kube-prometheus-stack-values.yaml
        skipCrds: false
    - repoURL: 'https://github.com/gek0/sample-k8s-gitops.git'
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true # required for kube-prometheus-stack CRDs
