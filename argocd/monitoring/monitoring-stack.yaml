apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  labels:
    tier: infra
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: cluster-ops
  sources:
    - repoURL: 'https://prometheus-community.github.io/helm-charts'
      chart: kube-prometheus-stack
      targetRevision: '92.10.1' # check https://github.com/prometheus-community/helm-charts/releases
      helm:
        valueFiles:
          - $values/services/monitoring/kube-prometheus-stack-values.yaml
        skipCrds: false
    - repoURL: 'https://grafana.github.io/helm-charts'
      chart: loki
      targetRevision: '7.3.0' # check https://artifacthub.io/packages/helm/grafana/loki
      helm:
        valueFiles:
          - $values/services/monitoring/loki-values.yaml
    - repoURL: 'https://grafana.github.io/helm-charts'
      chart: promtail
      targetRevision: '6.17.1' # check https://artifacthub.io/packages/helm/grafana/promtail
      helm:
        valueFiles:
          - $values/services/monitoring/promtail-values.yaml
    - repoURL: 'https://github.com/gek0/sample-k8s-gitops.git'
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
