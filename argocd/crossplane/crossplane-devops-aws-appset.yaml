apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: crossplane-devops-aws
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
          - env: prod
  template:
    metadata:
      name: 'crossplane-devops-aws-{{env}}'
    spec:
      project: github-personal
      source:
        repoURL: 'https://github.com/gek0/sample-k8s-gitops.git'
        targetRevision: HEAD
        path: 'components/crossplane/{{env}}/devops-aws'
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: github-personal-crossplane-devops-aws
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
