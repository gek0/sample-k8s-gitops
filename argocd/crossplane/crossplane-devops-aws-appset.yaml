apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: crossplane-devops-aws
  namespace: argocd
  labels:
    tier: infra
spec:
  generators:
    - list:
        elements:
          - env: dev
            chart: s3-bucket
          - env: prod
            chart: s3-bucket
          - env: dev
            chart: vpc
  template:
    metadata:
      name: 'crossplane-devops-aws-{{chart}}-{{env}}'
    spec:
      project: github-personal
      sources:
        - repoURL: 'https://github.com/gek0/sample-k8s-gitops.git'
          targetRevision: HEAD
          path: 'charts/crossplane/aws/{{chart}}'
          helm:
            valueFiles:
              - $values/services/crossplane/aws/devops/{{env}}/{{chart}}-values.yaml
        - repoURL: 'https://github.com/gek0/sample-k8s-gitops.git'
          targetRevision: HEAD
          ref: values
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: github-personal-crossplane-devops-aws
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
