apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-devops-aws-config
  namespace: argocd
  labels:
    tier: infra
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: cluster-ops
  source:
    repoURL: 'https://github.com/gek0/sample-k8s-gitops.git'
    targetRevision: HEAD
    path: services/crossplane/aws/devops
  destination:
    server: https://kubernetes.default.svc
    namespace: github-personal-crossplane-devops-aws
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
